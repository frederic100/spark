# Configuration Doctrine ORM
doctrine:
    dbal:
        url: '%env(DATABASE_URL)%'
        types:
            tenant_id: Spark\Infrastructure\Persistence\Doctrine\Type\TenantIdType
        
    orm:
        entity_managers:
            default:
                mappings:
                    Spark:
                        type: xml
                        dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/Mapping2'
                        prefix: 'Spark\Domain'
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true